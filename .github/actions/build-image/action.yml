name: Build image
description: >
  The head unit's toolchain image (native/cluster-render/docker), loaded from
  the Actions cache by its Dockerfile's checksum, or built and cached. Only
  test runs use it: the Release workflow builds its own.
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: echo "key=build-image-$(cksum < native/cluster-render/docker/Dockerfile | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/build-image.tar
        key: ${{ steps.key.outputs.key }}
    - if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: docker load -q -i "$RUNNER_TEMP/build-image.tar"
    # builds it when the cache had none (or one with another tag)
    - id: image
      shell: bash
      run: |
        tag=$(make -s -C native/cluster-render image)
        printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
    - name: Diagnose failed image networking
      if: failure() && steps.image.outcome == 'failure'
      shell: bash
      run: |
        echo 'Runner resolver'
        cat /etc/resolv.conf
        timeout 15 getent ahostsv4 archive.ubuntu.com security.ubuntu.com || true
        echo 'Pinned build image resolver'
        timeout 20 docker run --rm --network=host \
          ubuntu:18.04@sha256:dca176c9663a7ba4c1f0e710986f5a25e672842963d95b960191e2d9f7185ebe \
          sh -c 'cat /etc/resolv.conf; getent ahostsv4 archive.ubuntu.com security.ubuntu.com' || true
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TAG: ${{ steps.image.outputs.tag }}
      run: docker save "$TAG" -o "$RUNNER_TEMP/build-image.tar"
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/build-image.tar
        key: ${{ steps.key.outputs.key }}
