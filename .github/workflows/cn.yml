name: CN source checks

on:
  push:
    branches: [main, 'codex/beta/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
      - name: Publication policy
        run: node release/test/cn_distribution_test.js
      - name: Chinese catalog and version consistency
        run: node release/test/cn_localization_test.js
      - name: Localization
        working-directory: apps/robertn_waze_cluster
        run: node tools/test_i18n.js
      - name: Chinese dynamic status messages
        run: node apps/robertn_waze_cluster/tools/test_native_text.js
      - name: Waze RHMI identity and layout consistency
        run: node apps/robertn_waze_cluster/tools/check_rhmi.js
      - name: Localized application layouts and package integration
        run: |
          python3 localized/kit/tools/test_zh.py
          node tools/test_localized.js
      - name: Ambient controls and upstream regression checks
        run: |
          node localized/ambient/kit/tools/test_ambient_config.js
          node localized/ambient/kit/tools/test_ambient_rgb.js
          node localized/ambient/kit/tools/test_ambient_strobe.js
          node localized/ambient/kit/tools/test_ambient_others.js
# Unit tests do not set release-check/cn-integration.
